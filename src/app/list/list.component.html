<form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
  <input formControlName="title" />
  <input formControlName="author" />
  <input formControlName="pages" />
  <input formControlName="publishedDate" />
  <input type="checkbox" formControlName="read" />
  <button type="submit">SUBMIT</button>
</form>
<div *ngFor="let b of books()">
  <app-card
    [book]="b"
    (edit)="startEdit($event)"
    delete="deleteBook($event)"
  ></app-card>
</div>
